schema_version: "1"
task_id: T01
title: "Add GET /health/deep endpoint"
category: feature
difficulty: easy
max_seconds: 1800
estimated_tokens_baseline: null

prompt: |
  Add a new endpoint GET /health/deep to the FastAPI application in this repository.

  Requirements:
  - Route: GET /health/deep
  - Check connectivity to all configured external services (any database or cache configured via env vars)
  - Return a JSON object: {"status": "ok" | "degraded" | "down", "services": {"<name>": "<status>", ...}}
  - "ok" if all services respond, "degraded" if some fail, "down" if all fail
  - Follow the existing patterns in routers/status/ — create a new file there, register it in the router

  Implement and write at least one test in tests/.

acceptance_criteria:
  automated:
    - id: AC1
      type: shell
      command: "grep -r '/health/deep' . --include='*.py' | grep -v '__pycache__' | wc -l"
      pass_condition: "int(stdout.strip()) >= 1"
    - id: AC2
      type: shell
      command: "python3 -c \"import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('routers/**/*.py', recursive=True)]; print('ok')\""
      pass_condition: "stdout.strip() == 'ok'"
    - id: AC3
      type: shell
      command: "grep -r 'health' routers/ --include='*.py' -l | wc -l"
      pass_condition: "int(stdout.strip()) >= 1"
  human:
    - id: AC4
      description: "Endpoint is registered in the router hierarchy (not a loose function)"
      rubric: binary

reference_files:
  - routers/status/providers.py
  - routers/status/__init__.py
  - server.py

ground_truth_tokens:
  E0_median: null
  oracle_min: null
