<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ZOMBIE SURVIVAL</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #06070a;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 700px at 50% 40%, #10141c 0%, #06070a 70%);
  }
  #wrap {
    position: relative;
    line-height: 0;
    box-shadow: 0 0 0 1px #1e2430, 0 30px 80px -20px #000, 0 0 120px -40px #83d63a33;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: auto;
    cursor: none;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
"use strict";

// ───────────────────────────── setup ─────────────────────────────
const W = 1024, H = 640, PAD = 26;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
cv.width = W; cv.height = H;

const wrap = document.getElementById("wrap");
function fit() {
  const sc = Math.min(window.innerWidth / W, window.innerHeight / H, 1.6);
  wrap.style.width = (W * sc) + "px";
  wrap.style.height = (H * sc) + "px";
  cv.style.width = "100%";
  cv.style.height = "100%";
}
addEventListener("resize", fit); fit();

// persistent blood / scorch layer
const decal = document.createElement("canvas");
decal.width = W; decal.height = H;
const dctx = decal.getContext("2d");

const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

// ───────────────────────────── audio ─────────────────────────────
let actx = null, muted = false, noiseBuf = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo) {
  if (muted) return;
  const a = audio(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, q) {
  if (muted) return;
  const a = audio(), t = a.currentTime;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(120, t + dur);
  f.Q.value = q || 1;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t); s.stop(t + dur);
}
const SFX = {
  pistol:  () => { tone(680, 0.07, "square", 0.08, 180); noise(0.08, 0.10, 2600); },
  shotgun: () => { noise(0.26, 0.22, 1700, 2); tone(150, 0.16, "sawtooth", 0.10, 50); },
  rifle:   () => { tone(920, 0.05, "square", 0.05, 260); noise(0.06, 0.08, 3400); },
  hit:     () => { noise(0.05, 0.07, 900); },
  dead:    () => { tone(180, 0.20, "sawtooth", 0.09, 60); noise(0.16, 0.10, 700); },
  boom:    () => { noise(0.62, 0.34, 900, 0.7); tone(90, 0.5, "sine", 0.16, 28); },
  hurt:    () => { tone(220, 0.20, "sawtooth", 0.14, 70); },
  pick:    () => { tone(660, 0.08, "triangle", 0.10); setTimeout(() => tone(990, 0.10, "triangle", 0.09), 60); },
  reload:  () => { tone(300, 0.05, "square", 0.05); setTimeout(() => tone(420, 0.06, "square", 0.05), 130); },
  wave:    () => { tone(120, 0.5, "sawtooth", 0.10, 300); },
  over:    () => { tone(300, 1.1, "sawtooth", 0.14, 45); noise(0.9, 0.10, 500); },
};

// ───────────────────────────── input ─────────────────────────────
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false, fresh: false };
addEventListener("keydown", e => {
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab"].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyP" && (S.state === "play" || S.state === "pause"))
    S.state = S.state === "play" ? "pause" : "play";
  if (e.code === "KeyR") { if (S.state === "over") reset(); else if (S.state === "play") reload(); }
  if (S.state === "menu" && (e.code === "Space" || e.code === "Enter")) { audio(); reset(); }
  if (S.state === "over" && e.code === "Enter") reset();
  if (S.state === "play") {
    if (e.code === "Digit1") swap(0);
    if (e.code === "Digit2") swap(1);
    if (e.code === "Digit3") swap(2);
    if (e.code === "KeyQ") swap(-1);
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });
function aim(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = clamp((e.clientX - r.left) * (W / r.width), 0, W);
  mouse.y = clamp((e.clientY - r.top) * (H / r.height), 0, H);
}
cv.addEventListener("mousemove", aim);
cv.addEventListener("mousedown", e => {
  aim(e); mouse.down = true; mouse.fresh = true; audio();
  if (S.state === "menu") reset();
  else if (S.state === "over" && S.overT > 0.7) reset();
});
addEventListener("mouseup", () => { mouse.down = false; });
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => { e.preventDefault(); swap(-1); }, { passive: false });
addEventListener("blur", () => { mouse.down = false; if (S.state === "play") S.state = "pause"; });

// ───────────────────────────── data ─────────────────────────────
const WEAPONS = [
  { name: "PISTOL",  mag: 12, dmg: 30, rate: 0.17, reload: 0.80, spread: 0.030, pellets: 1, speed: 940,  auto: false, knock: 130, tint: "#ffd479", sfx: "pistol",  shake: 2.5 },
  { name: "SHOTGUN", mag: 6,  dmg: 17, rate: 0.62, reload: 1.35, spread: 0.155, pellets: 9, speed: 800,  auto: false, knock: 300, tint: "#7fe3ff", sfx: "shotgun", shake: 9 },
  { name: "RIFLE",   mag: 30, dmg: 18, rate: 0.085, reload: 1.55, spread: 0.055, pellets: 1, speed: 1100, auto: true,  knock: 95,  tint: "#b7ff6a", sfx: "rifle",   shake: 3 },
];
const ZTYPE = {
  walker: { r: 14, hp: 58,  spd: 54,  dmg: 9,  score: 10,  body: "#5c8f4c", head: "#8fd07a", eye: "#ff5a4a" },
  runner: { r: 11, hp: 34,  spd: 124, dmg: 6,  score: 18,  body: "#a8703b", head: "#e3b06c", eye: "#ffdf5a" },
  brute:  { r: 25, hp: 240, spd: 38,  dmg: 24, score: 45,  body: "#6b4470", head: "#b07ab5", eye: "#ff3ce0" },
  boss:   { r: 40, hp: 1100, spd: 34, dmg: 36, score: 400, body: "#8f2b2b", head: "#e05a5a", eye: "#ffb03a" },
};

// ───────────────────────────── state ─────────────────────────────
const S = {};
function reset() {
  S.state = "play";
  S.time = 0; S.shake = 0; S.overT = 0; S.flash = 0;
  S.score = 0; S.kills = 0; S.wave = 0; S.best = S.best || 0;
  S.shots = 0; S.hits = 0;
  S.combo = 1; S.comboT = 0;
  S.player = {
    x: W / 2, y: H / 2, r: 13, spd: 232, ang: 0, hp: 100, maxHp: 100,
    hurtT: 0, iT: 0, vx: 0, vy: 0, dashT: 0, dashCd: 0, flashT: 0, walk: 0,
  };
  S.mag = [12, 0, 0];
  S.reserve = [Infinity, 0, 0];
  S.unlocked = [true, false, false];
  S.cur = 0; S.fireCd = 0; S.reloading = false; S.reloadT = 0;
  S.zombies = []; S.bullets = []; S.parts = []; S.pickups = [];
  S.barrels = []; S.rings = []; S.floats = []; S.spawners = []; S.queue = [];
  S.spawnT = 0; S.waveActive = false; S.inter = 2.6; S.banner = 0; S.bannerTxt = "";
  dctx.clearRect(0, 0, W, H);
  spawnBarrels(4);
}
function swap(i) {
  if (S.reloading) { S.reloading = false; S.reloadT = 0; }
  if (i === -1) {
    for (let k = 1; k <= 2; k++) {
      const n = (S.cur + k) % 3;
      if (S.unlocked[n]) { S.cur = n; return; }
    }
    return;
  }
  if (S.unlocked[i]) S.cur = i;
}

// ───────────────────────────── spawning ─────────────────────────────
function edgePoint() {
  const s = irand(0, 3);
  if (s === 0) return { x: rand(PAD, W - PAD), y: PAD + 14 };
  if (s === 1) return { x: W - PAD - 14, y: rand(PAD, H - PAD) };
  if (s === 2) return { x: rand(PAD, W - PAD), y: H - PAD - 14 };
  return { x: PAD + 14, y: rand(PAD, H - PAD) };
}
function farPoint(minD) {
  let p, tries = 0;
  do { p = edgePoint(); tries++; }
  while (tries < 30 && Math.hypot(p.x - S.player.x, p.y - S.player.y) < minD);
  return p;
}
function spawnBarrels(n) {
  for (let i = 0; i < n; i++) {
    if (S.barrels.length > 9) break;
    let x, y, ok = false, t = 0;
    while (!ok && t++ < 40) {
      x = rand(PAD + 60, W - PAD - 60); y = rand(PAD + 60, H - PAD - 60);
      ok = Math.hypot(x - S.player.x, y - S.player.y) > 130 &&
           S.barrels.every(b => Math.hypot(x - b.x, y - b.y) > 70);
    }
    if (ok) S.barrels.push({ x, y, hp: 34, r: 15, wob: rand(0, TAU) });
  }
}
function buildWave() {
  S.wave++;
  S.waveActive = true;
  const w = S.wave;
  const q = [];
  const walkers = 5 + Math.floor(w * 2.1);
  for (let i = 0; i < walkers; i++) q.push("walker");
  if (w >= 3) for (let i = 0; i < Math.floor((w - 2) * 1.6); i++) q.push("runner");
  if (w >= 5) for (let i = 0; i < Math.floor((w - 4) * 0.9); i++) q.push("brute");
  if (w % 5 === 0) q.push("boss");
  for (let i = q.length - 1; i > 0; i--) { const j = irand(0, i); [q[i], q[j]] = [q[j], q[i]]; }
  S.queue = q;
  S.spawnT = 0;
  S.banner = 2.2; S.bannerTxt = (w % 5 === 0) ? "WAVE " + w + "  ::  BOSS" : "WAVE " + w;
  SFX.wave();
  spawnBarrels(w % 2 === 0 ? 2 : 1);
}
function makeZombie(type, x, y) {
  const t = ZTYPE[type], w = S.wave;
  const hp = t.hp * (1 + (w - 1) * 0.13);
  S.zombies.push({
    type, x, y, r: t.r, hp, maxHp: hp,
    spd: t.spd * (1 + Math.min(0.45, (w - 1) * 0.028)) * rand(0.9, 1.1),
    dmg: t.dmg * (1 + (w - 1) * 0.06),
    vx: 0, vy: 0, ang: 0, atk: 0, flash: 0, seed: rand(0, TAU), score: t.score,
  });
}

// ───────────────────────────── effects ─────────────────────────────
function burst(x, y, n, col, spd, life, size) {
  for (let i = 0; i < n && S.parts.length < 700; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.25, spd);
    S.parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(life * 0.5, life), max: life, col,
      size: rand(size * 0.5, size), drag: rand(0.86, 0.94), glow: false,
    });
  }
}
function blood(x, y, r, a) {
  dctx.globalAlpha = a;
  dctx.fillStyle = "#5d0d10";
  dctx.beginPath(); dctx.arc(x, y, r, 0, TAU); dctx.fill();
  dctx.globalAlpha = 1;
}
function splat(x, y, big) {
  const n = big ? 9 : 4;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), d = rand(0, big ? 26 : 12);
    blood(x + Math.cos(a) * d, y + Math.sin(a) * d, rand(big ? 5 : 2, big ? 15 : 6), rand(0.2, 0.5));
  }
}
function float(x, y, txt, col) {
  S.floats.push({ x, y, txt, col, life: 0.9 });
}
function explode(x, y, radius, dmg) {
  S.rings.push({ x, y, r: 6, max: radius, life: 0.5, col: "#ffb648" });
  S.shake = Math.max(S.shake, 16);
  S.flash = Math.max(S.flash, 0.35);
  burst(x, y, 46, "#ffcf5c", 620, 0.7, 6);
  burst(x, y, 26, "#ff5a2a", 400, 0.9, 9);
  burst(x, y, 16, "#6b6b6b", 180, 1.5, 12);
  SFX.boom();
  dctx.globalAlpha = 0.35; dctx.fillStyle = "#120c08";
  dctx.beginPath(); dctx.arc(x, y, radius * 0.5, 0, TAU); dctx.fill();
  dctx.globalAlpha = 1;

  for (const z of S.zombies) {
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < radius) {
      const f = 1 - d / radius;
      hurtZombie(z, dmg * f, (z.x - x) / (d || 1) * 520 * f, (z.y - y) / (d || 1) * 520 * f, true);
    }
  }
  const p = S.player, pd = Math.hypot(p.x - x, p.y - y);
  if (pd < radius * 0.8 && p.iT <= 0) {
    hurtPlayer(18 * (1 - pd / (radius * 0.8)));
    p.vx += (p.x - x) / (pd || 1) * 300; p.vy += (p.y - y) / (pd || 1) * 300;
  }
  for (const b of S.barrels) {
    if (b.hp > 0 && Math.hypot(b.x - x, b.y - y) < radius * 0.9) b.fuse = Math.min(b.fuse ?? 99, 0.12);
  }
}

// ───────────────────────────── combat ─────────────────────────────
function hurtZombie(z, dmg, kx, ky, noBlood) {
  z.hp -= dmg;
  z.flash = 0.12;
  z.vx += kx * 0.02; z.vy += ky * 0.02;
  if (!noBlood) {
    burst(z.x, z.y, 5, "#b3222a", 240, 0.35, 3);
    blood(z.x + rand(-6, 6), z.y + rand(-6, 6), rand(2, 5), 0.35);
  }
  if (z.hp <= 0) killZombie(z);
}
function killZombie(z) {
  const i = S.zombies.indexOf(z);
  if (i < 0) return;
  S.zombies.splice(i, 1);
  S.kills++;
  S.combo = Math.min(9, S.combo + (S.comboT > 0 ? 1 : 0));
  S.comboT = 2.4;
  const pts = Math.round(z.score * S.combo);
  S.score += pts;
  float(z.x, z.y - z.r - 6, "+" + pts, S.combo > 1 ? "#ffd479" : "#cfd8e3");
  burst(z.x, z.y, z.type === "boss" ? 60 : 16, "#8e1b22", 300, 0.6, z.type === "boss" ? 7 : 4);
  splat(z.x, z.y, z.r > 20);
  SFX.dead();
  if (z.type === "boss") { explode(z.x, z.y, 150, 90); S.shake = 22; }
  // drops
  const roll = Math.random();
  if (roll < 0.11) drop(z.x, z.y, "ammo");
  else if (roll < 0.17) drop(z.x, z.y, "health");
}
function drop(x, y, type) {
  S.pickups.push({ x, y, type, life: 22, seed: rand(0, TAU),
    vx: rand(-40, 40), vy: rand(-40, 40) });
}
function hurtPlayer(dmg) {
  const p = S.player;
  if (p.iT > 0) return;
  p.hp -= dmg;
  p.iT = 0.45; p.hurtT = 0.35;
  S.shake = Math.max(S.shake, 9);
  SFX.hurt();
  burst(p.x, p.y, 8, "#ff4d4d", 200, 0.4, 3);
  if (p.hp <= 0) {
    p.hp = 0;
    S.state = "over"; S.overT = 0;
    S.best = Math.max(S.best, S.score);
    burst(p.x, p.y, 40, "#c22", 420, 1.0, 5);
    splat(p.x, p.y, true);
    S.shake = 26;
    SFX.over();
  }
}

// ───────────────────────────── weapons ─────────────────────────────
function reload() {
  const w = WEAPONS[S.cur];
  if (S.reloading || S.mag[S.cur] >= w.mag) return;
  const avail = S.cur === 0 ? Infinity : S.reserve[S.cur];
  if (avail <= 0) return;
  S.reloading = true; S.reloadT = w.reload;
  SFX.reload();
}
function finishReload() {
  const w = WEAPONS[S.cur];
  const need = w.mag - S.mag[S.cur];
  const take = S.cur === 0 ? need : Math.min(need, S.reserve[S.cur]);
  S.mag[S.cur] += take;
  if (S.cur !== 0) S.reserve[S.cur] -= take;
  S.reloading = false;
}
function fire() {
  const w = WEAPONS[S.cur], p = S.player;
  if (S.reloading || S.fireCd > 0) return;
  if (S.mag[S.cur] <= 0) { reload(); return; }
  S.mag[S.cur]--; S.fireCd = w.rate;
  const mx = p.x + Math.cos(p.ang) * 20, my = p.y + Math.sin(p.ang) * 20;
  for (let i = 0; i < w.pellets; i++) {
    const a = p.ang + rand(-w.spread, w.spread);
    const sp = w.speed * rand(0.92, 1.08);
    S.bullets.push({
      x: mx, y: my, px: mx, py: my,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      dmg: w.dmg, knock: w.knock, life: 1.1, tint: w.tint,
    });
    S.shots++;
  }
  p.vx -= Math.cos(p.ang) * w.knock * 0.32;
  p.vy -= Math.sin(p.ang) * w.knock * 0.32;
  p.flashT = 0.06;
  S.shake = Math.max(S.shake, w.shake);
  burst(mx, my, w.pellets > 1 ? 10 : 4, "#ffdca8", 260, 0.18, 3);
  SFX[w.sfx]();
}

// ───────────────────────────── update ─────────────────────────────
function update(dt) {
  S.time += dt;
  S.shake *= Math.pow(0.0016, dt);
  S.flash = Math.max(0, S.flash - dt * 2.2);
  S.banner = Math.max(0, S.banner - dt);
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 1; }

  const p = S.player;

  // ---- player movement ----
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const il = Math.hypot(ix, iy) || 1;
  ix /= il; iy /= il;

  p.dashCd = Math.max(0, p.dashCd - dt);
  p.dashT = Math.max(0, p.dashT - dt);
  if ((keys.ShiftLeft || keys.ShiftRight || keys.Space) && p.dashCd <= 0 && (ix || iy)) {
    p.dashT = 0.17; p.dashCd = 1.5; p.iT = Math.max(p.iT, 0.22);
    p.vx += ix * 620; p.vy += iy * 620;
    burst(p.x, p.y, 12, "#7fe3ff", 180, 0.35, 3);
    tone(520, 0.12, "triangle", 0.06, 900);
  }
  const acc = p.dashT > 0 ? 0 : p.spd * 12;
  p.vx += ix * acc * dt; p.vy += iy * acc * dt;
  const fr = Math.pow(0.0009, dt);
  p.vx *= fr; p.vy *= fr;
  const vlen = Math.hypot(p.vx, p.vy), capv = p.dashT > 0 ? 900 : p.spd;
  if (vlen > capv) { p.vx = p.vx / vlen * capv; p.vy = p.vy / vlen * capv; }
  p.x = clamp(p.x + p.vx * dt, PAD + p.r, W - PAD - p.r);
  p.y = clamp(p.y + p.vy * dt, PAD + p.r, H - PAD - p.r);
  p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  p.iT = Math.max(0, p.iT - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  p.flashT = Math.max(0, p.flashT - dt);
  if (Math.hypot(p.vx, p.vy) > 30) p.walk += dt * 12;

  // dash trail
  if (p.dashT > 0 && S.parts.length < 700)
    S.parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, max: 0.25,
      col: "#7fe3ff", size: 9, drag: 1, glow: true });

  // ---- shooting ----
  S.fireCd = Math.max(0, S.fireCd - dt);
  if (S.reloading) { S.reloadT -= dt; if (S.reloadT <= 0) finishReload(); }
  if (keys.KeyR) reload();
  const w = WEAPONS[S.cur];
  if (mouse.down && (w.auto || mouse.fresh)) { fire(); mouse.fresh = false; }
  if (!mouse.down) mouse.fresh = false;

  // ---- wave flow ----
  if (!S.waveActive) {
    S.inter -= dt;
    if (S.inter <= 0) buildWave();
  } else {
    S.spawnT -= dt;
    const rate = clamp(0.85 - S.wave * 0.04, 0.22, 0.85);
    if (S.queue.length && S.spawnT <= 0 && S.zombies.length + S.spawners.length < 46) {
      S.spawnT = rate;
      const type = S.queue.pop();
      const pt = farPoint(type === "boss" ? 340 : 250);
      S.spawners.push({ x: pt.x, y: pt.y, t: 0.65, type });
    }
    if (!S.queue.length && !S.spawners.length && !S.zombies.length) {
      S.waveActive = false;
      S.inter = 4.2;
      S.banner = 2.0; S.bannerTxt = "WAVE CLEARED";
      S.score += 50 * S.wave;
      for (let i = 0; i < 2; i++) {
        const pt = { x: rand(PAD + 60, W - PAD - 60), y: rand(PAD + 60, H - PAD - 60) };
        drop(pt.x, pt.y, "ammo");
      }
      drop(rand(PAD + 60, W - PAD - 60), rand(PAD + 60, H - PAD - 60), "health");
      p.hp = Math.min(p.maxHp, p.hp + 10);
    }
  }
  for (let i = S.spawners.length - 1; i >= 0; i--) {
    const s = S.spawners[i];
    s.t -= dt;
    if (s.t <= 0) {
      makeZombie(s.type, s.x, s.y);
      burst(s.x, s.y, 10, "#6b1b1b", 180, 0.4, 4);
      S.spawners.splice(i, 1);
    }
  }

  // ---- zombies ----
  for (let i = 0; i < S.zombies.length; i++) {
    const z = S.zombies[i];
    const dx = p.x - z.x, dy = p.y - z.y;
    const d = Math.hypot(dx, dy) || 1;
    z.ang = Math.atan2(dy, dx);
    const wob = Math.sin(S.time * 6 + z.seed) * (z.type === "runner" ? 0.35 : 0.16);
    const ux = Math.cos(z.ang + wob), uy = Math.sin(z.ang + wob);
    z.vx += ux * z.spd * 6 * dt;
    z.vy += uy * z.spd * 6 * dt;

    // separation
    for (let j = i + 1; j < S.zombies.length; j++) {
      const o = S.zombies[j];
      const ox = o.x - z.x, oy = o.y - z.y;
      const od = Math.hypot(ox, oy);
      const min = z.r + o.r;
      if (od < min && od > 0.01) {
        const push = (min - od) / min * 260;
        z.vx -= ox / od * push * dt; z.vy -= oy / od * push * dt;
        o.vx += ox / od * push * dt; o.vy += oy / od * push * dt;
      }
    }

    const zf = Math.pow(0.002, dt);
    z.vx *= zf; z.vy *= zf;
    const zl = Math.hypot(z.vx, z.vy);
    const zcap = z.spd * 2.4;
    if (zl > zcap) { z.vx = z.vx / zl * zcap; z.vy = z.vy / zl * zcap; }
    z.x = clamp(z.x + z.vx * dt, PAD + z.r, W - PAD - z.r);
    z.y = clamp(z.y + z.vy * dt, PAD + z.r, H - PAD - z.r);
    z.flash = Math.max(0, z.flash - dt);
    z.atk = Math.max(0, z.atk - dt);

    if (d < z.r + p.r + 2 && z.atk <= 0) {
      z.atk = 0.85;
      hurtPlayer(z.dmg);
      p.vx += dx / d * 220; p.vy += dy / d * 220;
      z.vx -= dx / d * 160; z.vy -= dy / d * 160;
    }
    // barrels get shoved / damaged by brutes
    if (z.r > 20) {
      for (const b of S.barrels) {
        if (b.hp > 0 && Math.hypot(b.x - z.x, b.y - z.y) < z.r + b.r) b.hp -= 40 * dt;
      }
    }
  }

  // ---- bullets ----
  for (let i = S.bullets.length - 1; i >= 0; i--) {
    const b = S.bullets[i];
    b.life -= dt;
    b.px = b.x; b.py = b.y;
    const stepLen = Math.hypot(b.vx, b.vy) * dt;
    const steps = Math.max(1, Math.ceil(stepLen / 9));
    let dead = b.life <= 0;
    for (let s = 0; s < steps && !dead; s++) {
      b.x += b.vx * dt / steps;
      b.y += b.vy * dt / steps;
      if (b.x < PAD || b.x > W - PAD || b.y < PAD || b.y > H - PAD) {
        burst(b.x, b.y, 4, "#8b93a3", 150, 0.25, 2);
        dctx.globalAlpha = 0.2; dctx.fillStyle = "#0c0c0e";
        dctx.beginPath(); dctx.arc(b.x, b.y, 3, 0, TAU); dctx.fill();
        dctx.globalAlpha = 1;
        dead = true; break;
      }
      for (const z of S.zombies) {
        if (Math.hypot(z.x - b.x, z.y - b.y) < z.r + 3) {
          S.hits++;
          hurtZombie(z, b.dmg, b.vx * 0.55, b.vy * 0.55);
          SFX.hit();
          dead = true; break;
        }
      }
      if (dead) break;
      for (const bl of S.barrels) {
        if (bl.hp > 0 && Math.hypot(bl.x - b.x, bl.y - b.y) < bl.r + 3) {
          bl.hp -= b.dmg;
          burst(b.x, b.y, 5, "#ffb648", 200, 0.3, 3);
          dead = true; break;
        }
      }
    }
    if (dead) S.bullets.splice(i, 1);
  }

  // ---- barrels ----
  for (let i = S.barrels.length - 1; i >= 0; i--) {
    const b = S.barrels[i];
    if (b.fuse !== undefined) {
      b.fuse -= dt;
      if (b.fuse <= 0) { S.barrels.splice(i, 1); explode(b.x, b.y, 132, 150); }
      continue;
    }
    if (b.hp <= 0) { S.barrels.splice(i, 1); explode(b.x, b.y, 132, 150); }
  }

  // ---- pickups ----
  for (let i = S.pickups.length - 1; i >= 0; i--) {
    const k = S.pickups[i];
    k.life -= dt;
    k.x = clamp(k.x + k.vx * dt, PAD + 10, W - PAD - 10);
    k.y = clamp(k.y + k.vy * dt, PAD + 10, H - PAD - 10);
    k.vx *= Math.pow(0.02, dt); k.vy *= Math.pow(0.02, dt);
    if (k.life <= 0) { S.pickups.splice(i, 1); continue; }
    if (Math.hypot(k.x - p.x, k.y - p.y) < p.r + 14) {
      S.pickups.splice(i, 1);
      SFX.pick();
      burst(k.x, k.y, 12, k.type === "ammo" ? "#ffd479" : "#5ce08a", 200, 0.45, 3);
      if (k.type === "health") {
        p.hp = Math.min(p.maxHp, p.hp + 35);
        float(k.x, k.y - 12, "+35 HP", "#5ce08a");
      } else {
        float(k.x, k.y - 12, giveAmmo(), "#ffd479");
      }
    }
  }

  // ---- particles / rings / floats ----
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const q = S.parts[i];
    q.life -= dt;
    if (q.life <= 0) { S.parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const f = Math.pow(q.drag, dt * 60);
    q.vx *= f; q.vy *= f;
  }
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const r = S.rings[i];
    r.life -= dt;
    r.r = lerp(r.r, r.max, dt * 9);
    if (r.life <= 0) S.rings.splice(i, 1);
  }
  for (let i = S.floats.length - 1; i >= 0; i--) {
    const f = S.floats[i];
    f.life -= dt; f.y -= dt * 26;
    if (f.life <= 0) S.floats.splice(i, 1);
  }

  // fade blood slowly
  if (Math.random() < dt * 3) {
    dctx.globalCompositeOperation = "destination-out";
    dctx.fillStyle = "rgba(0,0,0,0.035)";
    dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = "source-over";
  }
}
function giveAmmo() {
  if (!S.unlocked[1]) { S.unlocked[1] = true; S.reserve[1] = 18; S.cur = 1; S.mag[1] = 0; reload(); return "SHOTGUN!"; }
  if (!S.unlocked[2]) { S.unlocked[2] = true; S.reserve[2] = 90; S.cur = 2; S.mag[2] = 0; reload(); return "RIFLE!"; }
  S.reserve[1] += 8; S.reserve[2] += 40;
  return "+AMMO";
}

// ───────────────────────────── render ─────────────────────────────
function drawArena() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#12161e");
  g.addColorStop(1, "#0a0d13");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#1a2130";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = PAD; x <= W - PAD; x += 48) { ctx.moveTo(x + 0.5, PAD); ctx.lineTo(x + 0.5, H - PAD); }
  for (let y = PAD; y <= H - PAD; y += 48) { ctx.moveTo(PAD, y + 0.5); ctx.lineTo(W - PAD, y + 0.5); }
  ctx.stroke();

  // walls
  ctx.fillStyle = "#171d27";
  ctx.fillRect(0, 0, W, PAD); ctx.fillRect(0, H - PAD, W, PAD);
  ctx.fillRect(0, 0, PAD, H); ctx.fillRect(W - PAD, 0, PAD, H);
  ctx.strokeStyle = "#2b3648"; ctx.lineWidth = 2;
  ctx.strokeRect(PAD - 1, PAD - 1, W - PAD * 2 + 2, H - PAD * 2 + 2);
  ctx.fillStyle = "#232c3b";
  for (let x = 0; x < W; x += 22) { ctx.fillRect(x + 4, 6, 14, 4); ctx.fillRect(x + 4, H - 10, 14, 4); }
}
function drawBarrel(b) {
  const fus = b.fuse !== undefined;
  const pulse = fus ? 0.5 + Math.sin(S.time * 60) * 0.5 : 0;
  ctx.save();
  ctx.translate(b.x, b.y + 3);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(0, 8, b.r, b.r * 0.42, 0, 0, TAU); ctx.fill();
  ctx.translate(0, -3);
  const g = ctx.createLinearGradient(-b.r, 0, b.r, 0);
  g.addColorStop(0, fus ? "#ff8a3a" : "#7a3a1e");
  g.addColorStop(0.4, fus ? "#ffd07a" : "#c2591f");
  g.addColorStop(1, fus ? "#ff6a2a" : "#6a2f16");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(-b.r, -b.r - 2, b.r * 2, b.r * 2 + 4, 5); ctx.fill();
  ctx.fillStyle = "rgba(255,240,200," + (0.22 + pulse * 0.5) + ")";
  ctx.fillRect(-b.r, -5, b.r * 2, 4);
  ctx.fillRect(-b.r, 5, b.r * 2, 2);
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(-b.r, -b.r - 2, b.r * 2, b.r * 2 + 4, 5); ctx.stroke();
  ctx.fillStyle = "#1a0f08";
  ctx.font = "bold 13px ui-monospace, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("!", 0, 0);
  if (fus) {
    ctx.shadowBlur = 26; ctx.shadowColor = "#ff9a3a";
    ctx.fillStyle = "rgba(255,190,90," + (0.3 + pulse * 0.4) + ")";
    ctx.beginPath(); ctx.arc(0, 0, b.r + 6, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}
function drawZombie(z) {
  const t = ZTYPE[z.type];
  const bob = Math.sin(S.time * 9 + z.seed) * (z.r * 0.09);
  ctx.save();
  ctx.translate(z.x, z.y);
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(0, z.r * 0.55, z.r * 0.95, z.r * 0.38, 0, 0, TAU); ctx.fill();
  ctx.rotate(z.ang);
  // arms
  ctx.strokeStyle = t.body;
  ctx.lineWidth = z.r * 0.38; ctx.lineCap = "round";
  const sw = Math.sin(S.time * 10 + z.seed) * z.r * 0.18;
  ctx.beginPath();
  ctx.moveTo(z.r * 0.1, -z.r * 0.6); ctx.lineTo(z.r * 1.25, -z.r * 0.42 + sw);
  ctx.moveTo(z.r * 0.1, z.r * 0.6); ctx.lineTo(z.r * 1.25, z.r * 0.42 - sw);
  ctx.stroke();
  // body
  ctx.fillStyle = t.body;
  ctx.beginPath(); ctx.arc(0, bob, z.r, 0, TAU); ctx.fill();
  ctx.fillStyle = t.head;
  ctx.beginPath(); ctx.arc(z.r * 0.28, bob, z.r * 0.66, 0, TAU); ctx.fill();
  // eyes
  ctx.fillStyle = t.eye;
  ctx.shadowBlur = 10; ctx.shadowColor = t.eye;
  ctx.beginPath(); ctx.arc(z.r * 0.72, bob - z.r * 0.26, z.r * 0.13, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r * 0.72, bob + z.r * 0.26, z.r * 0.13, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  if (z.flash > 0) {
    ctx.globalAlpha = z.flash / 0.12 * 0.8;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, bob, z.r + 1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // hp bar for tough ones
  if (z.maxHp > 100 && z.hp < z.maxHp) {
    const bw = z.r * 2.2;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(z.x - bw / 2, z.y - z.r - 12, bw, 5);
    ctx.fillStyle = z.type === "boss" ? "#ff5a4a" : "#d078d8";
    ctx.fillRect(z.x - bw / 2, z.y - z.r - 12, bw * (z.hp / z.maxHp), 5);
  }
}
function drawPlayer() {
  const p = S.player;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.beginPath(); ctx.ellipse(0, 9, 13, 5.5, 0, 0, TAU); ctx.fill();

  // aim line
  ctx.save();
  ctx.rotate(p.ang);
  ctx.strokeStyle = "rgba(131,214,58,0.13)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(360, 0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.rotate(p.ang);
  // gun
  ctx.fillStyle = "#2a3140";
  ctx.beginPath(); ctx.roundRect(6, -3.5, 22, 7, 2); ctx.fill();
  ctx.fillStyle = "#404b60";
  ctx.beginPath(); ctx.roundRect(6, -3.5, 12, 7, 2); ctx.fill();
  if (p.flashT > 0) {
    ctx.save();
    ctx.globalAlpha = p.flashT / 0.06;
    ctx.fillStyle = "#ffe9a8";
    ctx.shadowBlur = 24; ctx.shadowColor = "#ffcf5c";
    ctx.beginPath();
    ctx.moveTo(28, 0); ctx.lineTo(40, -7); ctx.lineTo(46, 0); ctx.lineTo(40, 7);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // body
  const hurt = p.hurtT > 0;
  ctx.fillStyle = hurt ? "#ff6b6b" : "#20303f";
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
  ctx.strokeStyle = p.iT > 0 ? "#7fe3ff" : "#83d63a";
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
  ctx.fillStyle = hurt ? "#ffd0d0" : "#83d63a";
  ctx.beginPath(); ctx.arc(4, 0, 5.5, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawHUD() {
  const p = S.player;
  ctx.textBaseline = "top";
  // health
  ctx.textAlign = "left";
  const bx = PAD + 10, by = PAD + 10, bw = 250, bh = 18;
  ctx.fillStyle = "rgba(4,6,10,0.72)";
  ctx.beginPath(); ctx.roundRect(bx - 5, by - 5, bw + 10, bh + 10, 6); ctx.fill();
  ctx.fillStyle = "#241417";
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill();
  const hf = p.hp / p.maxHp;
  const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hg.addColorStop(0, hf > 0.35 ? "#4ad06a" : "#e0453a");
  hg.addColorStop(1, hf > 0.35 ? "#a6f05a" : "#ff8a5a");
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.roundRect(bx, by, Math.max(2, bw * hf), bh, 4); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  for (let i = 1; i < 5; i++) ctx.fillRect(bx + bw / 5 * i, by, 2, bh);
  ctx.fillStyle = "#e7f0e0";
  ctx.font = "bold 12px ui-monospace, monospace";
  ctx.fillText("HP " + Math.ceil(p.hp), bx + 8, by + 3);

  // dash meter
  const dy = by + bh + 9;
  ctx.fillStyle = "rgba(4,6,10,0.6)";
  ctx.beginPath(); ctx.roundRect(bx - 5, dy - 3, bw + 10, 12, 5); ctx.fill();
  ctx.fillStyle = "#1b2733";
  ctx.beginPath(); ctx.roundRect(bx, dy, bw, 6, 3); ctx.fill();
  ctx.fillStyle = p.dashCd <= 0 ? "#7fe3ff" : "#3d6070";
  ctx.beginPath(); ctx.roundRect(bx, dy, bw * (1 - p.dashCd / 1.5), 6, 3); ctx.fill();

  // weapon

    ctx.beginPath(); ctx.roundRect(sx, sy, 28, 28, 6); ctx.stroke();
    ctx.fillStyle = S.unlocked[i] ? WEAPONS[i].tint : "#3a4451";
    ctx.font = "bold 13px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.fillText(S.unlocked[i] ? String(i + 1) : "×", sx + 14, sy + 8);
    ctx.textAlign = "left";
  }

  // score
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(4,6,10,0.72)";
  ctx.beginPath(); ctx.roundRect(W - PAD - 195, PAD + 5, 190, 54, 8); ctx.fill();
  ctx.fillStyle = "#8c97a8";
  ctx.font = "bold 11px ui-monospace, monospace";

  ctx.fillStyle = "#eef3f8";
  ctx.font = "bold 24px ui-monospace, monospace";
  ctx.fillText(String(S.score), W - PAD - 16, PAD + 26);
  if (S.combo > 1) {
    ctx.fillStyle = "#ffd479";

  ctx.fillText("WAVE " + Math.max(1, S.wave), W / 2, PAD + 11);

  ctx.font = "bold 16px ui-monospace, monospace";
  ctx.fillText(S.waveActive ? left + " REMAINING" : "NEXT IN " + Math.ceil(S.inter), W / 2, PAD + 25);

    ctx.fillRect(0, H / 2 - 46, W, 92);
    ctx.strokeStyle = "rgba(131,214,58,0.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H / 2 - 46); ctx.lineTo(W, H / 2 - 46);
    ctx.moveTo(0, H / 2 + 46); ctx.lineTo(W, H / 2 + 46); ctx.stroke();
    ctx.fillStyle = "#e9f5df";
    ctx.font = "bold 46px ui-monospace, monospace";
    ctx.shadowBlur = 24; ctx.shadowColor = "#83d63a";
    ctx.fillText(S.bannerTxt, W / 2, H / 2);
    ctx.restore();
  }

  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(140,151,168,0.5)";
  ctx.font = "10px ui-monospace, monospace";
  ctx.fillText("WASD move  ·  MOUSE aim/fire  ·  1-3 weapon  ·  R reload  ·  SHIFT dash  ·  P pause  ·  M " + (muted ? "unmute" : "mute"), PAD + 6, H - PAD - 74);
}
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(6,8,12,0.9)";
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = "rgba(131,214,58,0.3)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.stroke();
}
function drawMenu() {
  ctx.fillStyle = "rgba(4,6,10,0.82)";
  ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 260, H / 2 - 175, 520, 350);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#83d63a";
  ctx.shadowBlur = 30; ctx.shadowColor = "#83d63a";
  ctx.font = "bold 54px ui-monospace, monospace";
  ctx.fillText("ZOMBIE", W / 2, H / 2 - 120);
  ctx.fillStyle = "#e9f5df";
  ctx.fillText("SURVIVAL", W / 2, H / 2 - 68);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#8c97a8";
  ctx.font = "13px ui-monospace, monospace";
  const lines = [
    "WASD / ARROWS   move",
    "MOUSE           aim + fire",
    "SHIFT / SPACE   dash",
    "1 2 3 / Q       switch weapon",
    "R               reload      P   pause",
    "",
    "Shoot the red barrels. Grab the drops.",
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 20 + i * 22));
  const pulse = 0.6 + Math.sin(S.time * 4) * 0.4;
  ctx.fillStyle = "rgba(131,214,58," + pulse + ")";
  ctx.font = "bold 20px ui-monospace, monospace";
  ctx.fillText("CLICK  OR  PRESS SPACE", W / 2, H / 2 + 145);
}
function drawOver() {
  ctx.fillStyle = "rgba(30,4,4," + Math.min(0.8, S.overT * 0.9) + ")";
  ctx.fillRect(0, 0, W, H);
  if (S.overT < 0.25) return;
  panel(W / 2 - 240, H / 2 - 160, 480, 320);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ff4d4d";
  ctx.shadowBlur = 30; ctx.shadowColor = "#ff2d2d";
  ctx.font = "bold 56px ui-monospace, monospace";
  ctx.fillText("YOU DIED", W / 2, H / 2 - 105);
  ctx.shadowBlur = 0;
  const acc = S.shots ? Math.round(S.hits / S.shots * 100) : 0;
  const rows = [
    ["SCORE", String(S.score)],
    ["BEST", String(S.best)],
    ["WAVE REACHED", String(Math.max(1, S.wave))],
    ["ZOMBIES KILLED", String(S.kills)],
    ["ACCURACY", acc + "%"],
  ];
  ctx.font = "14px ui-monospace, monospace";
  rows.forEach((r, i) => {
    const y = H / 2 - 45 + i * 28;
    ctx.textAlign = "left";
    ctx.fillStyle = "#8c97a8";
    ctx.fillText(r[0], W / 2 - 175, y);
    ctx.textAlign = "right";
    ctx.fillStyle = i === 0 ? "#83d63a" : "#e9f5df";
    ctx.font = (i === 0 ? "bold 18px" : "14px") + " ui-monospace, monospace";
    ctx.fillText(r[1], W / 2 + 175, y);
    ctx.font = "14px ui-monospace, monospace";
  });
  ctx.textAlign = "center";
  const pulse = 0.55 + Math.sin(S.time * 5) * 0.45;
  ctx.fillStyle = "rgba(131,214,58," + pulse + ")";
  ctx.font = "bold 19px ui-monospace, monospace";
  ctx.fillText("PRESS  R  OR  CLICK  TO  RESTART", W / 2, H / 2 + 120);
}
function drawPause() {
  ctx.fillStyle = "rgba(4,6,10,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#e9f5df";
  ctx.font = "bold 44px ui-monospace, monospace";
  ctx.fillText("PAUSED", W / 2, H / 2 - 10);
  ctx.fillStyle = "#8c97a8";
  ctx.font = "14px ui-monospace, monospace";
  ctx.fillText("press P to resume", W / 2, H / 2 + 34);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sh = S.shake || 0;
  ctx.save();
  if (sh > 0.2) ctx.translate(rand(-sh, sh), rand(-sh, sh));

  drawArena();
  ctx.drawImage(decal, 0, 0);

  if (S.state !== "menu") {
    // spawn telegraphs
    for (const s of S.spawners) {
      const f = 1 - s.t / 0.65;
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(S.time * 22) * 0.2;
      ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, 8 + f * 20, 0, TAU); ctx.stroke();
      ctx.fillStyle = "rgba(140,20,20,0.22)";
      ctx.beginPath(); ctx.arc(s.x, s.y, 8 + f * 20, 0, TAU); ctx.fill();
      ctx.restore();
    }
    for (const b of S.barrels) drawBarrel(b);

    // pickups
    for (const k of S.pickups) {
      const bob = Math.sin(S.time * 4 + k.seed) * 3;
      const blink = k.life < 4 && Math.sin(k.life * 18) < 0;
      if (blink) continue;
      ctx.save();
      ctx.translate(k.x, k.y + bob);
      const col = k.type === "ammo" ? "#ffd479" : "#5ce08a";
      ctx.shadowBlur = 18; ctx.shadowColor = col;
      ctx.fillStyle = "rgba(6,10,14,0.9)";
      ctx.beginPath(); ctx.roundRect(-11, -11, 22, 22, 5); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-11, -11, 22, 22, 5); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = col;
      if (k.type === "ammo") {
        ctx.fillRect(-6, -6, 4, 12); ctx.fillRect(-1, -6, 4, 12); ctx.fillRect(4, -6, 3, 12);
      } else {
        ctx.fillRect(-6, -2.5, 12, 5); ctx.fillRect(-2.5, -6, 5, 12);
      }
      ctx.restore();
    }

    // explosion rings
    for (const r of S.rings) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, r.life / 0.5);
      ctx.strokeStyle = r.col; ctx.lineWidth = 4 * (r.life / 0.5) + 1;
      ctx.shadowBlur = 24; ctx.shadowColor = r.col;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    for (const z of S.zombies) drawZombie(z);
    if (S.state !== "over") drawPlayer();

    // bullets
    ctx.lineCap = "round";
    for (const b of S.bullets) {
      ctx.save();
      ctx.strokeStyle = b.tint;
      ctx.shadowBlur = 12; ctx.shadowColor = b.tint;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.px, b.py);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }

    // particles
    for (const q of S.parts) {
      const a = clamp(q.life / q.max, 0, 1);
      ctx.globalAlpha = a;
      if (q.glow) { ctx.shadowBlur = 14; ctx.shadowColor = q.col; }
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size * a + 0.4, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    // floating text
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const f of S.floats) {
      ctx.globalAlpha = clamp(f.life / 0.9, 0, 1);
      ctx.fillStyle = f.col;
      ctx.font = "bold 14px ui-monospace, monospace";
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.86);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.72)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // low health pulse
  if (S.state === "play" && S.player.hp / S.player.maxHp < 0.34) {
    ctx.fillStyle = "rgba(190,20,20," + (0.10 + Math.sin(S.time * 6) * 0.07) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (S.flash > 0) {
    ctx.fillStyle = "rgba(255,190,120," + S.flash * 0.30 + ")";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  if (S.state === "play" || S.state === "pause") drawHUD();
  if (S.state === "menu") drawMenu();
  if (S.state === "pause") drawPause();
  if (S.state === "over") { drawHUD(); drawOver(); }

  // crosshair
  if (S.state === "play") {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = "rgba(233,245,223,0.85)";
    ctx.lineWidth = 1.6;
    const g = 5 + (S.fireCd > 0 ? 4 : 0);
    ctx.beginPath();
    ctx.moveTo(-g - 7, 0); ctx.lineTo(-g, 0);
    ctx.moveTo(g, 0); ctx.lineTo(g + 7, 0);
    ctx.moveTo(0, -g - 7); ctx.lineTo(0, -g);
    ctx.moveTo(0, g); ctx.lineTo(0, g + 7);
    ctx.stroke();
    ctx.fillStyle = "#83d63a";
    ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
  }
}

// ───────────────────────────── loop ─────────────────────────────
S.state = "menu"; S.time = 0; S.best = 0;
reset(); S.state = "menu";

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.state === "play") update(dt);
  else {
    S.time += dt;
    S.shake *= Math.pow(0.002, dt);
    if (S.state === "over") {
      S.overT += dt;
      for (let i = S.parts.length - 1; i >= 0; i--) {
        const q = S.parts[i];
        q.life -= dt;
        if (q.life <= 0) { S.parts.splice(i, 1); continue; }
        q.x += q.vx * dt; q.y += q.vy * dt;
        const f = Math.pow(q.drag, dt * 60);
        q.vx *= f; q.vy *= f;
      }
      for (let i = S.rings.length - 1; i >= 0; i--) {
        const r = S.rings[i];
        r.life -= dt; r.r = lerp(r.r, r.max, dt * 9);
        if (r.life <= 0) S.rings.splice(i, 1);
      }
    }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
