<rect x="96" y="170" width="72" height="8" rx="4" fill="#ffb39b"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">What it is</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">A Next.js 16 and React 19 app where you enter</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">a site like stripe.com and it opens that brand</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">as a browsable world.</text><circle cx="106" cy="540.2" r="9" fill="#ffb39b"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Search bar takes any domain</text><circle cx="106" cy="608.7" r="9" fill="#ffb39b"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Demo starts on vercel.com</text><circle cx="106" cy="677.2" r="9" fill="#ffb39b"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">Sidebar lists example worlds</text></svg>