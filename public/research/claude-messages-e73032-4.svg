<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">claude-messages</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">How messages get sent</text><circle cx="106" cy="365.2" r="9" fill="#83d63a"/><text x="140" y="377.2" font-size="34" font-weight="400" fill="#f5f6f2">Sessions started here: a user line on stdin</text><text x="140" y="419.7" font-size="34" font-weight="400" fill="#f5f6f2">(stream-json)</text><circle cx="106" cy="476.2" r="9" fill="#83d63a"/><text x="140" y="488.2" font-size="34" font-weight="400" fill="#f5f6f2">Any other session: one frame on its inbox</text><text x="140" y="530.7" font-size="34" font-weight="400" fill="#f5f6f2">socket</text><circle cx="106" cy="587.2" r="9" fill="#83d63a"/><text x="140" y="599.2" font-size="34" font-weight="400" fill="#f5f6f2">Same socket sessions use for SendMessage</text><circle cx="106" cy="655.7" r="9" fill="#83d63a"/><text x="140" y="667.7" font-size="34" font-weight="400" fill="#f5f6f2">Tool approvals appear as Allow and Deny</text><text x="140" y="710.2" font-size="34" font-weight="400" fill="#f5f6f2">bubbles</text></svg>