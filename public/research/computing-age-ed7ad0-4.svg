<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">computing-age</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#dcb86e"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Two ages, two looks</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">The look changes with the technology.</text><circle cx="106" cy="450.2" r="9" fill="#dcb86e"/><text x="140" y="462.2" font-size="34" font-weight="400" fill="#f5f6f2">I to III: aged paper, ink and red accent</text><circle cx="106" cy="518.7" r="9" fill="#dcb86e"/><text x="140" y="530.7" font-size="34" font-weight="400" fill="#f5f6f2">IV to VII: gold on black</text><circle cx="106" cy="587.2" r="9" fill="#dcb86e"/><text x="140" y="599.2" font-size="34" font-weight="400" fill="#f5f6f2">Chromatic aberration on every cut</text><circle cx="106" cy="655.7" r="9" fill="#dcb86e"/><text x="140" y="667.7" font-size="34" font-weight="400" fill="#f5f6f2">Film grain and flicker throughout</text><circle cx="106" cy="724.2" r="9" fill="#dcb86e"/><text x="140" y="736.2" font-size="34" font-weight="400" fill="#f5f6f2">A log-scale year ruler along the bottom</text></svg>