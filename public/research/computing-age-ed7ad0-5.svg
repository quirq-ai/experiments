<text x="96" y="430" font-size="125" font-weight="800" fill="#dcb86e">5.5s to 4.0s</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">The film speeds up</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Scene length shrinks chapter by chapter, so the</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">pacing itself accelerates. A running ops/second</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">index climbs the whole way.</text></svg>