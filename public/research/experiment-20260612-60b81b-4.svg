<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">How a run works</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Each cell is one agent run of one task (T01 to</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">T10) in one environment. Every run gets its</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">own git worktree cut from a pinned SHA, and</text><text x="96" y="512.2" font-size="36" font-weight="400" fill="#b9bdb2">telemetry is extracted from the transcript</text><text x="96" y="557.2" font-size="36" font-weight="400" fill="#b9bdb2">afterward.</text></svg>