<text x="96" y="430" font-size="107" font-weight="800" fill="#83d63a">317k &gt; 278k &gt; </text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">Early signal: T01 effective</text><text x="96" y="627.5" font-size="54" font-weight="700" fill="#f5f6f2">tokens</text><text x="96" y="721" font-size="34" font-weight="400" fill="#b9bdb2">E0, E1, E2 on Codex. About 96% of input was</text><text x="96" y="763.5" font-size="34" font-weight="400" fill="#b9bdb2">cached, so the cache-discounted total is the</text><text x="96" y="806" font-size="34" font-weight="400" fill="#b9bdb2">meaningful cost metric.</text></svg>