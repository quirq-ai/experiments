<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">innernet</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#3b6fd4"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Private by default</text><circle cx="106" cy="365.2" r="9" fill="#3b6fd4"/><text x="140" y="377.2" font-size="34" font-weight="400" fill="#f5f6f2">Server binds to 127.0.0.1 only</text><circle cx="106" cy="433.7" r="9" fill="#3b6fd4"/><text x="140" y="445.7" font-size="34" font-weight="400" fill="#f5f6f2">Credential folders like .ssh and .aws are</text><text x="140" y="488.2" font-size="34" font-weight="400" fill="#f5f6f2">never entered</text><circle cx="106" cy="544.7" r="9" fill="#3b6fd4"/><text x="140" y="556.7" font-size="34" font-weight="400" fill="#f5f6f2">Generated folders are skipped</text><circle cx="106" cy="613.2" r="9" fill="#3b6fd4"/><text x="140" y="625.2" font-size="34" font-weight="400" fill="#f5f6f2">Data leaves only if you connect your own</text><text x="140" y="667.7" font-size="34" font-weight="400" fill="#f5f6f2">remote database</text></svg>