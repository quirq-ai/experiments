<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Questions in, typed</text><text x="96" y="327.2" font-size="60" font-weight="800" fill="#f5f6f2">answers out</text><text x="96" y="444.4" font-size="36" font-weight="400" fill="#b9bdb2">Send a state (string or JSON) plus typed</text><text x="96" y="489.4" font-size="36" font-weight="400" fill="#b9bdb2">questions. Jev answers all of them in one</text><text x="96" y="534.4" font-size="36" font-weight="400" fill="#b9bdb2">pass.</text><circle cx="106" cy="607.4" r="9" fill="#83d63a"/><text x="140" y="619.4" font-size="34" font-weight="400" fill="#f5f6f2">Noul: is this true? (0 to 1)</text><circle cx="106" cy="675.9" r="9" fill="#83d63a"/><text x="140" y="687.9" font-size="34" font-weight="400" fill="#f5f6f2">Choice: pick from up to 255 options</text><circle cx="106" cy="744.4" r="9" fill="#83d63a"/><text x="140" y="756.4" font-size="34" font-weight="400" fill="#f5f6f2">Score: place on a 2 to 10 level scale</text></svg>