<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">What it is</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">An encoder plus a decision head answers typed</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">questions over any state in one forward pass.</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">No generation, so nothing to parse or</text><text x="96" y="512.2" font-size="36" font-weight="400" fill="#b9bdb2">hallucinate.</text><circle cx="106" cy="585.2" r="9" fill="#83d63a"/><text x="140" y="597.2" font-size="34" font-weight="400" fill="#f5f6f2">choice: pick a label</text><circle cx="106" cy="653.7" r="9" fill="#83d63a"/><text x="140" y="665.7" font-size="34" font-weight="400" fill="#f5f6f2">score: ordinal level</text><circle cx="106" cy="722.2" r="9" fill="#83d63a"/><text x="140" y="734.2" font-size="34" font-weight="400" fill="#f5f6f2">noul: calibrated P(true)</text></svg>