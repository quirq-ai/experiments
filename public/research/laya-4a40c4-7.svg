<text x="86" y="360" font-size="240" font-weight="800" fill="#83d63a" opacity="0.9">“</text><text x="96" y="440" font-size="52" font-weight="600" fill="#f5f6f2">Base checkpoints are near</text><text x="96" y="502.4" font-size="52" font-weight="600" fill="#f5f6f2">chance zero-shot on</text><text x="96" y="564.8" font-size="52" font-weight="600" fill="#f5f6f2">typed-decisions: 0.362 against</text><text x="96" y="627.2" font-size="52" font-weight="600" fill="#f5f6f2">a 0.318 random baseline. The</text><text x="96" y="689.6" font-size="52" font-weight="600" fill="#f5f6f2">published 0.766 comes from</text><text x="96" y="752" font-size="52" font-weight="600" fill="#f5f6f2">fine-tuning. Treat Laya as a</text><text x="96" y="814.4" font-size="52" font-weight="600" fill="#f5f6f2">fast base to specialise.</text><text x="96" y="936.8" font-size="34" fill="#83d63a">Honest about limits</text></svg>