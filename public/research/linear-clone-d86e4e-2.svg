<rect x="96" y="170" width="72" height="8" rx="4" fill="#5e6ad2"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">What it is</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">A Linear-style tracker with a dark, dense,</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">keyboard-driven UI. It is a visualizer for XO</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">data plus a simple work-item tool.</text><circle cx="106" cy="540.2" r="9" fill="#5e6ad2"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Issues, OKRs, sprints</text><circle cx="106" cy="608.7" r="9" fill="#5e6ad2"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Calendar, members, wiki</text><circle cx="106" cy="677.2" r="9" fill="#5e6ad2"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">C for new issue, Cmd K for palette</text></svg>