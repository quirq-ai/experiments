<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">linear-clone</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#5e6ad2"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Two kinds of state</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Mirror data resyncs on every load. Local data</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">sticks around.</text><circle cx="106" cy="495.2" r="9" fill="#5e6ad2"/><text x="140" y="507.2" font-size="34" font-weight="400" fill="#f5f6f2">Mirror: issues, members, projects</text><circle cx="106" cy="563.7" r="9" fill="#5e6ad2"/><text x="140" y="575.7" font-size="34" font-weight="400" fill="#f5f6f2">Local: sprints, OKRs, wiki</text><circle cx="106" cy="632.2" r="9" fill="#5e6ad2"/><text x="140" y="644.2" font-size="34" font-weight="400" fill="#f5f6f2">Local lives in localStorage</text><circle cx="106" cy="700.7" r="9" fill="#5e6ad2"/><text x="140" y="712.7" font-size="34" font-weight="400" fill="#f5f6f2">Edits to mirrored data vanish on sync</text></svg>