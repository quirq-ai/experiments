<rect x="96" y="170" width="72" height="8" rx="4" fill="#f97316"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">What Makepad is</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">An AI-accelerated app and game environment for</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">Rust, with a live-editable design language and</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">a fast iteration loop.</text><circle cx="106" cy="540.2" r="9" fill="#f97316"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Native and web targets</text><circle cx="106" cy="608.7" r="9" fill="#f97316"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Scriptable UI DSL</text><circle cx="106" cy="677.2" r="9" fill="#f97316"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">GPU 2D and 3D rendering</text><circle cx="106" cy="745.7" r="9" fill="#f97316"/><text x="140" y="757.7" font-size="34" font-weight="400" fill="#f5f6f2">Runs on iOS, Android, wasm, Quest</text></svg>