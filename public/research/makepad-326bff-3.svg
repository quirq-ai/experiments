<text x="96" y="430" font-size="190" font-weight="800" fill="#f97316">8 of 9</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">Faster than Rapier</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Its pure-Rust port of Box3D beat Rapier on eight</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">of nine benchmark scenes, +33% geomean, using</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">zero external crates.</text></svg>