<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><radialGradient id="g" cx="85%" cy="5%" r="90%"><stop offset="0" stop-color="#f97316" stop-opacity="0.38"/><stop offset="0.55" stop-color="#f97316" stop-opacity="0.06"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1080" fill="#0d0f0c"/><rect width="1080" height="1080" fill="url(#g)"/>
<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">makepad</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#f97316"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">The store outlives every</text><text x="96" y="327.2" font-size="60" font-weight="800" fill="#f5f6f2">window</text><text x="96" y="444.4" font-size="36" font-weight="400" fill="#b9bdb2">The asset server is its own daemon, so closing</text><text x="96" y="489.4" font-size="36" font-weight="400" fill="#b9bdb2">one app never drops the catalog for the</text><text x="96" y="534.4" font-size="36" font-weight="400" fill="#b9bdb2">others.</text><circle cx="106" cy="607.4" r="9" fill="#f97316"/><text x="140" y="619.4" font-size="34" font-weight="400" fill="#f5f6f2">Asset UI, VJ and workers are clients</text><circle cx="106" cy="675.9" r="9" fill="#f97316"/><text x="140" y="687.9" font-size="34" font-weight="400" fill="#f5f6f2">Restart detected in about 3.5 s</text><circle cx="106" cy="744.4" r="9" fill="#f97316"/><text x="140" y="756.4" font-size="34" font-weight="400" fill="#f5f6f2">Clients rejoin automatically</text><circle cx="106" cy="812.9" r="9" fill="#f97316"/><text x="140" y="824.9" font-size="34" font-weight="400" fill="#f5f6f2">One server per root, enforced</text></svg>