<text x="96" y="250" font-size="30" font-weight="700" letter-spacing="6" fill="#83d63a">PROTOTYPE</text><text x="96" y="360" font-size="80" font-weight="800" fill="#f5f6f2">One Meet call, two</text><text x="96" y="448" font-size="80" font-weight="800" fill="#f5f6f2">transcripts. Which</text><text x="96" y="536" font-size="80" font-weight="800" fill="#f5f6f2">one wins?</text><text x="96" y="664" font-size="36" font-weight="400" fill="#b9bdb2">A Next.js app that gets Google Meet</text><text x="96" y="709" font-size="36" font-weight="400" fill="#b9bdb2">transcripts via a bot and via Google's own</text><text x="96" y="754" font-size="36" font-weight="400" fill="#b9bdb2">API.</text></svg>