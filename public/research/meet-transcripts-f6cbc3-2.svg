<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Way 1: send a bot</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Self-hosted Attendee joins the call as a guest</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">and reads Meet's live captions. Works on any</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">Meet link, any account.</text><circle cx="106" cy="540.2" r="9" fill="#83d63a"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Live, while the call runs</text><circle cx="106" cy="608.7" r="9" fill="#83d63a"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Needs Docker</text><circle cx="106" cy="677.2" r="9" fill="#83d63a"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">Someone must admit the bot from the lobby</text></svg>