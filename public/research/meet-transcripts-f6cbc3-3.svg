<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">meet-transcripts</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Way 2: ask Google</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">The Meet REST API returns the transcript Meet</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">made itself. Invisible in the call, but more</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">restricted.</text><circle cx="106" cy="540.2" r="9" fill="#83d63a"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Only meetings you organized</text><circle cx="106" cy="608.7" r="9" fill="#83d63a"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Transcription must be turned on</text><circle cx="106" cy="677.2" r="9" fill="#83d63a"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">Available after the call, kept 30 days</text><circle cx="106" cy="745.7" r="9" fill="#83d63a"/><text x="140" y="757.7" font-size="34" font-weight="400" fill="#f5f6f2">Needs a Workspace plan with Meet transcripts</text></svg>