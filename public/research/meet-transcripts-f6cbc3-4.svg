<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">How the bot works</text><circle cx="106" cy="365.2" r="9" fill="#83d63a"/><text x="140" y="377.2" font-size="34" font-weight="400" fill="#f5f6f2">POST /bots with the Meet link and caption</text><text x="140" y="419.7" font-size="34" font-weight="400" fill="#f5f6f2">settings</text><circle cx="106" cy="476.2" r="9" fill="#83d63a"/><text x="140" y="488.2" font-size="34" font-weight="400" fill="#f5f6f2">Recording format is none, so no S3 bucket</text><circle cx="106" cy="544.7" r="9" fill="#83d63a"/><text x="140" y="556.7" font-size="34" font-weight="400" fill="#f5f6f2">Bot waits in the lobby until admitted</text><circle cx="106" cy="613.2" r="9" fill="#83d63a"/><text x="140" y="625.2" font-size="34" font-weight="400" fill="#f5f6f2">Page re-reads the transcript every 3 seconds</text><text x="140" y="667.7" font-size="34" font-weight="400" fill="#f5f6f2">until ended</text></svg>