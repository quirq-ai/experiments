<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">navier-stokes</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#246cb4"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Key insight</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Each equation term gets its own lesson. Turn</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">off advection, diffusion or pressure</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">correction and see the flow break. Raising</text><text x="96" y="512.2" font-size="36" font-weight="400" fill="#b9bdb2">viscosity makes vortex kinetic energy decay</text><text x="96" y="557.2" font-size="36" font-weight="400" fill="#b9bdb2">faster.</text></svg>