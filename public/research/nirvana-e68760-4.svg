<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Pause frees compute, keeps</text><text x="96" y="327.2" font-size="60" font-weight="800" fill="#f5f6f2">files</text><text x="96" y="444.4" font-size="36" font-weight="400" fill="#b9bdb2">On pause the pod is deleted but the PVC is</text><text x="96" y="489.4" font-size="36" font-weight="400" fill="#b9bdb2">retained. On resume a new pod re-mounts the</text><text x="96" y="534.4" font-size="36" font-weight="400" fill="#b9bdb2">same storage at /workspace.</text></svg>