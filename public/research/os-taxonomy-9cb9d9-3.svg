<rect x="96" y="170" width="72" height="8" rx="4" fill="#4f9dff"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Not a flat list of</text><text x="96" y="327.2" font-size="60" font-weight="800" fill="#f5f6f2">standards</text><text x="96" y="444.4" font-size="36" font-weight="400" fill="#b9bdb2">Each micro-topic is one teachable idea, like</text><text x="96" y="489.4" font-size="36" font-weight="400" fill="#b9bdb2">'Building sentences', with a plain</text><text x="96" y="534.4" font-size="36" font-weight="400" fill="#b9bdb2">description, mastery evidence, a type and an</text><text x="96" y="579.4" font-size="36" font-weight="400" fill="#b9bdb2">age range.</text></svg>