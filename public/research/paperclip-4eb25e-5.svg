<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">paperclip</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#3b82f6"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Built like a real company</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">It looks like a task manager, but under the</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">hood:</text><circle cx="106" cy="495.2" r="9" fill="#3b82f6"/><text x="140" y="507.2" font-size="34" font-weight="400" fill="#f5f6f2">Org charts with roles and reporting lines</text><circle cx="106" cy="563.7" r="9" fill="#3b82f6"/><text x="140" y="575.7" font-size="34" font-weight="400" fill="#f5f6f2">Heartbeats: agents wake on a schedule and</text><text x="140" y="618.2" font-size="34" font-weight="400" fill="#f5f6f2">act</text><circle cx="106" cy="674.7" r="9" fill="#3b82f6"/><text x="140" y="686.7" font-size="34" font-weight="400" fill="#f5f6f2">Goal alignment: every task traces to the</text><text x="140" y="729.2" font-size="34" font-weight="400" fill="#f5f6f2">mission</text><circle cx="106" cy="785.7" r="9" fill="#3b82f6"/><text x="140" y="797.7" font-size="34" font-weight="400" fill="#f5f6f2">Monthly budgets per agent, they stop at the</text><text x="140" y="840.2" font-size="34" font-weight="400" fill="#f5f6f2">limit</text><circle cx="106" cy="896.7" r="9" fill="#3b82f6"/><text x="140" y="908.7" font-size="34" font-weight="400" fill="#f5f6f2">Immutable audit log with tool-call tracing</text></svg>