<rect x="96" y="170" width="72" height="8" rx="4" fill="#4f8cff"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">What it is</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">SPACE stands for Sandboxed Platform for</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">Agentic Code Execution. Apps use an HTTP API</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">to create Linux environments, run commands,</text><text x="96" y="512.2" font-size="36" font-weight="400" fill="#b9bdb2">and collect output.</text></svg>