<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><radialGradient id="g" cx="85%" cy="5%" r="90%"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#4f8cff" stop-opacity="0.06"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1080" fill="#0d0f0c"/><rect width="1080" height="1080" fill="url(#g)"/>
<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">perplexity-space</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#4f8cff"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">How it works</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">A template is the starting environment. A</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">sandbox is an instance with its own VM and</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">writable filesystem.</text><circle cx="106" cy="540.2" r="9" fill="#4f8cff"/><text x="140" y="552.2" font-size="34" font-weight="400" fill="#f5f6f2">Create sandbox from a template</text><circle cx="106" cy="608.7" r="9" fill="#4f8cff"/><text x="140" y="620.7" font-size="34" font-weight="400" fill="#f5f6f2">Wait for readiness</text><circle cx="106" cy="677.2" r="9" fill="#4f8cff"/><text x="140" y="689.2" font-size="34" font-weight="400" fill="#f5f6f2">Create a command session and attach</text><circle cx="106" cy="745.7" r="9" fill="#4f8cff"/><text x="140" y="757.7" font-size="34" font-weight="400" fill="#f5f6f2">Keep, pause, or suspend, then wake</text><circle cx="106" cy="814.2" r="9" fill="#4f8cff"/><text x="140" y="826.2" font-size="34" font-weight="400" fill="#f5f6f2">Delete the sandbox</text></svg>