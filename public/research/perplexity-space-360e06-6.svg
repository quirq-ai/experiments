<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><radialGradient id="g" cx="85%" cy="5%" r="90%"><stop offset="0" stop-color="#4f8cff" stop-opacity="0.38"/><stop offset="0.55" stop-color="#4f8cff" stop-opacity="0.06"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1080" fill="#0d0f0c"/><rect width="1080" height="1080" fill="url(#g)"/>
<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">perplexity-space</text>
<text x="96" y="430" font-size="150" font-weight="800" fill="#4f8cff">4 profiles</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">Benchmarked suspend and</text><text x="96" y="627.5" font-size="54" font-weight="700" fill="#f5f6f2">restore</text><text x="96" y="721" font-size="34" font-weight="400" fill="#b9bdb2">Build, alloc-free, file-heavy, and idle</text><text x="96" y="763.5" font-size="34" font-weight="400" fill="#b9bdb2">workloads. Every cycle checks SHA-256 checksums</text><text x="96" y="806" font-size="34" font-weight="400" fill="#b9bdb2">so a memory mismatch counts as a correctness</text><text x="96" y="848.5" font-size="34" font-weight="400" fill="#b9bdb2">failure.</text></svg>