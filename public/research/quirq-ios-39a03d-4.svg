<rect x="96" y="170" width="72" height="8" rx="4" fill="#f4f3f0"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">The device loop</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Setup once, then repeat each round.</text><circle cx="106" cy="450.2" r="9" fill="#f4f3f0"/><text x="140" y="462.2" font-size="34" font-weight="400" fill="#f5f6f2">Add Apple Account in Xcode</text><circle cx="106" cy="518.7" r="9" fill="#f4f3f0"/><text x="140" y="530.7" font-size="34" font-weight="400" fill="#f5f6f2">Trust the iPhone, enable Developer Mode</text><circle cx="106" cy="587.2" r="9" fill="#f4f3f0"/><text x="140" y="599.2" font-size="34" font-weight="400" fill="#f5f6f2">Claude builds a signed copy and bumps the</text><text x="140" y="641.7" font-size="34" font-weight="400" fill="#f5f6f2">build number</text><circle cx="106" cy="698.2" r="9" fill="#f4f3f0"/><text x="140" y="710.2" font-size="34" font-weight="400" fill="#f5f6f2">Claude installs it over cable or network</text><circle cx="106" cy="766.7" r="9" fill="#f4f3f0"/><text x="140" y="778.7" font-size="34" font-weight="400" fill="#f5f6f2">Check the stamp, then request changes</text></svg>