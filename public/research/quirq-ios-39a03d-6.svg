<text x="96" y="430" font-size="107" font-weight="800" fill="#f4f3f0">0x8140 vs 0x81</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">The blocker</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Xcode 16.4 supports chips up to the A18 Pro</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">(0x8140). The iPhone 17 Pro's A19 Pro is 0x8150,</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">so it cannot mount, register or build.</text></svg>