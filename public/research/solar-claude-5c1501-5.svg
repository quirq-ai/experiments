<text x="96" y="430" font-size="136" font-weight="800" fill="#83d63a">84.7% vs 2%</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">What the audit found</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Varied training averaged 84.7% success against</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">2% untrained on 50 held-out worlds. One seed</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">scored only 27 of 50, so variability is</text><text x="96" y="781" font-size="34" font-weight="400" fill="#b9bdb2">material.</text></svg>