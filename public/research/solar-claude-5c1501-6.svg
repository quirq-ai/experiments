<text x="86" y="360" font-size="240" font-weight="800" fill="#83d63a" opacity="0.9">“</text><text x="96" y="440" font-size="52" font-weight="600" fill="#f5f6f2">A reduced software model, not</text><text x="96" y="502.4" font-size="52" font-weight="600" fill="#f5f6f2">whole-brain emulation. It uses</text><text x="96" y="564.8" font-size="52" font-weight="600" fill="#f5f6f2">an engineered steering prior</text><text x="96" y="627.2" font-size="52" font-weight="600" fill="#f5f6f2">and privileged reward shaping</text><text x="96" y="689.6" font-size="52" font-weight="600" fill="#f5f6f2">during training.</text><text x="96" y="812" font-size="34" fill="#83d63a">Honest about its limits</text></svg>