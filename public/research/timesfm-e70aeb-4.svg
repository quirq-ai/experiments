<text x="96" y="430" font-size="190" font-weight="800" fill="#83d63a">100B+</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">Pretraining scale</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Real-world time-points, including Google Trends</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">and Wikipedia pageviews. It learned trend,</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">seasonality and spikes, then applies them to</text><text x="96" y="781" font-size="34" font-weight="400" fill="#b9bdb2">unseen series.</text></svg>