<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">TimesFM 2.5 vs 2.0</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">A smaller model with much longer memory.</text><circle cx="106" cy="450.2" r="9" fill="#83d63a"/><text x="140" y="462.2" font-size="34" font-weight="400" fill="#f5f6f2">200M parameters, down from 500M</text><circle cx="106" cy="518.7" r="9" fill="#83d63a"/><text x="140" y="530.7" font-size="34" font-weight="400" fill="#f5f6f2">16k context, up from 2048</text><circle cx="106" cy="587.2" r="9" fill="#83d63a"/><text x="140" y="599.2" font-size="34" font-weight="400" fill="#f5f6f2">Quantile forecasts up to 1k horizon</text><circle cx="106" cy="655.7" r="9" fill="#83d63a"/><text x="140" y="667.7" font-size="34" font-weight="400" fill="#f5f6f2">No frequency indicator needed</text><circle cx="106" cy="724.2" r="9" fill="#83d63a"/><text x="140" y="736.2" font-size="34" font-weight="400" fill="#f5f6f2">Covariates via XReg</text></svg>