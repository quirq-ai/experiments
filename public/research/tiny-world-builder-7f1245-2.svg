<text x="96" y="110" font-size="28" font-weight="600" fill="#ffffff" opacity="0.55">tiny-world-builder</text>
<rect x="96" y="170" width="72" height="8" rx="4" fill="#3a72c8"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Four things you can do</text><circle cx="106" cy="365.2" r="9" fill="#3a72c8"/><text x="140" y="377.2" font-size="34" font-weight="400" fill="#f5f6f2">Build: terrain, props, homes, paths, crops,</text><text x="140" y="419.7" font-size="34" font-weight="400" fill="#f5f6f2">animals</text><circle cx="106" cy="476.2" r="9" fill="#3a72c8"/><text x="140" y="488.2" font-size="34" font-weight="400" fill="#f5f6f2">Fly: switch camera modes, explore every</text><text x="140" y="530.7" font-size="34" font-weight="400" fill="#f5f6f2">angle</text><circle cx="106" cy="587.2" r="9" fill="#3a72c8"/><text x="140" y="599.2" font-size="34" font-weight="400" fill="#f5f6f2">Sculpt: raise, lower, paint into cliffs and</text><text x="140" y="641.7" font-size="34" font-weight="400" fill="#f5f6f2">rivers</text><circle cx="106" cy="698.2" r="9" fill="#3a72c8"/><text x="140" y="710.2" font-size="34" font-weight="400" fill="#f5f6f2">Share: save, remix, export, open to real</text><text x="140" y="752.7" font-size="34" font-weight="400" fill="#f5f6f2">players</text></svg>