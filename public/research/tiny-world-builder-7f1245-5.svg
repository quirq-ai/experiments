<rect x="96" y="170" width="72" height="8" rx="4" fill="#3a72c8"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Cars that react to your</text><text x="96" y="327.2" font-size="60" font-weight="800" fill="#f5f6f2">edits</text><text x="96" y="444.4" font-size="36" font-weight="400" fill="#b9bdb2">Vehicles drive only on path cells. Drop a rock</text><text x="96" y="489.4" font-size="36" font-weight="400" fill="#b9bdb2">or tree on a road and active cars reroute, or</text><text x="96" y="534.4" font-size="36" font-weight="400" fill="#b9bdb2">stop if no alternate path exists.</text></svg>