<rect x="96" y="170" width="72" height="8" rx="4" fill="#83d63a"/><text x="96" y="260" font-size="60" font-weight="800" fill="#f5f6f2">Counter-intuitive part</text><text x="96" y="377.2" font-size="36" font-weight="400" fill="#b9bdb2">Dry biomass is about 50% carbon. Roots mostly</text><text x="96" y="422.2" font-size="36" font-weight="400" fill="#b9bdb2">drink water and borrow a few minerals. The</text><text x="96" y="467.2" font-size="36" font-weight="400" fill="#b9bdb2">wood is built from air.</text></svg>