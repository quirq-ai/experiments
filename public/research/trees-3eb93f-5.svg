<text x="96" y="430" font-size="190" font-weight="800" fill="#83d63a">~50%</text><text x="96" y="560" font-size="54" font-weight="700" fill="#f5f6f2">Respiration eats a lot</text><text x="96" y="653.5" font-size="34" font-weight="400" fill="#b9bdb2">Autotrophic respiration burns roughly half of</text><text x="96" y="696" font-size="34" font-weight="400" fill="#b9bdb2">gross photosynthesis. The rest, NPP, becomes</text><text x="96" y="738.5" font-size="34" font-weight="400" fill="#b9bdb2">biomass. At night the tree emits CO₂.</text></svg>